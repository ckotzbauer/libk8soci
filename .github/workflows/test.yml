name: test

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  test:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@fd699521fc995525d339964a82f6f781581bf471 # 0.57.0
    with:
      install-go: true
      install-cosign: true
      install-goreleaser: true
      test-commands: make test
      report-coverage: true
      coverage-file: cover.out