name: test

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  test:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-build-test.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-go: true
      install-cosign: true
      install-goreleaser: true
      test-commands: make test
      report-coverage: true
      coverage-file: cover.out