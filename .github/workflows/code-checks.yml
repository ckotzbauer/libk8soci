name: code-checks

on:
  pull_request: {}
  push:
    branches:
      - "**"

permissions:
  actions: read
  contents: read

jobs:
  gosec:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-go: true
      go-version: "1.26" # pinned lint tools (golangci-lint v2.11.3, gosec v2.24.7) are incompatible with Go 1.27
      lint-commands: |
        make bootstrap-tools
        make lintsec

  golint:
    uses: ckotzbauer/actions-toolkit/.github/workflows/toolkit-lint.yml@70492262e47019908260a22d989ea8c55c549cdb # 0.58.1
    with:
      install-go: true
      go-version: "1.26" # pinned lint tools (golangci-lint v2.11.3, gosec v2.24.7) are incompatible with Go 1.27
      lint-commands: |
        make bootstrap-tools
        make lint